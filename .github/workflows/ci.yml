name: CI

on:
  push:
    branches: [main, stable]
    tags: ['v*']
  pull_request:
    branches: [main, stable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdrm-dev libgbm-dev libegl1-mesa-dev libgl1-mesa-dev xorg-dev libglu1-mesa-dev

      # nozzle-dev#196: published Linux binaries target x86-64-v2 explicitly, not
      # the image compiler's default (x86-64-v3 on ubuntu-26.04).
      - name: Set x86-64-v2 baseline
        if: runner.os == 'Linux'
        run: |
          echo "CFLAGS=-march=x86-64-v2 -mtune=generic" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-march=x86-64-v2 -mtune=generic" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNOZZLE_TESTER_BUILD_GUI=ON -DNOZZLE_TESTER_BUILD_TESTS=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNOZZLE_TESTER_BUILD_GUI=ON -DNOZZLE_TESTER_BUILD_TESTS=ON
          else
            cmake -S . -B build -DNOZZLE_TESTER_BUILD_GUI=ON -DNOZZLE_TESTER_BUILD_TESTS=ON
          fi

      - name: Verify single-config Release configuration
        if: runner.os != 'Windows'
        shell: bash
        run: |
          grep -E '^CMAKE_(GENERATOR|BUILD_TYPE|C_FLAGS|CXX_FLAGS)(:|_RELEASE:)' build/CMakeCache.txt
          grep -Fx 'CMAKE_BUILD_TYPE:STRING=Release' build/CMakeCache.txt

      - name: Build
        if: runner.os == 'Windows'
        run: cmake --build build --config Release

      - name: Build with effective compile flags
        if: runner.os != 'Windows'
        run: cmake --build build --config Release --verbose

      - name: Verify x86-64-v2 ISA baseline
        if: runner.os == 'Linux'
        run: bash deps/nozzle/scripts/check_x86_64_isa.sh build/nozzle-tester-cli build/nozzle-tester

      - name: Test
        run: ctest --test-dir build --build-config Release --verbose

      - name: Verify universal binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for binary in build/nozzle-tester.app/Contents/MacOS/nozzle-tester build/nozzle-tester-cli; do
            archs=$(lipo -archs "$binary")
            echo "$binary: $archs"
            echo "$archs" | grep -q "arm64" || { echo "Missing arm64 slice in $binary"; exit 1; }
            echo "$archs" | grep -q "x86_64" || { echo "Missing x86_64 slice in $binary"; exit 1; }
          done
          test -f build/nozzle-tester.app/Contents/Info.plist
          test -x build/nozzle-tester.app/Contents/MacOS/nozzle-tester

      - name: Generate evidence fixture
        shell: bash
        run: |
          if [ -x build/nozzle-tester-cli ]; then
            CLI=build/nozzle-tester-cli
          else
            CLI=build/Release/nozzle-tester-cli.exe
          fi
          "$CLI" self-test --evidence build/nozzle-tester-self-test.json
          python scripts/validate-evidence.py build/nozzle-tester-self-test.json

      - name: Stage release package
        id: package
        shell: bash
        run: |
          repo="${{ github.event.repository.name }}"
          short_sha="${GITHUB_SHA::7}"
          case "${{ runner.os }}" in
            Linux) platform="linux-x64" ;;
            macOS) platform="macos-universal" ;;
            Windows) platform="windows-x64" ;;
            *) echo "unsupported runner OS: ${{ runner.os }}" >&2; exit 1 ;;
          esac
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            package_name="${repo}-${GITHUB_REF_NAME}-${platform}"
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            package_name="${repo}-latest-${short_sha}-${platform}"
          elif [[ "${GITHUB_REF}" == refs/heads/stable ]]; then
            package_name="${repo}-stable-${short_sha}-${platform}"
          else
            package_name="${repo}-ci-${short_sha}-${platform}"
          fi
          mkdir -p "$package_name"
          if [ "${{ runner.os }}" = "macOS" ]; then
            test -d build/nozzle-tester.app
            test -x build/nozzle-tester.app/Contents/MacOS/nozzle-tester
            cp build/nozzle-tester-cli "$package_name/"
            cp -R build/nozzle-tester.app "$package_name/"
          elif [ -x build/nozzle-tester-cli ]; then
            cp build/nozzle-tester-cli "$package_name/"
            cp build/nozzle-tester "$package_name/"
          else
            cp build/Release/nozzle-tester-cli.exe "$package_name/"
            cp build/Release/nozzle-tester.exe "$package_name/"
          fi
          cp build/nozzle-tester-self-test.json "$package_name/"
          cp README.md "$package_name/"
          cp -R docs "$package_name/docs"
          cmake -E tar cf "${package_name}.zip" --format=zip "$package_name"
          if [ "${{ runner.os }}" = "macOS" ]; then
            zipinfo -l "${package_name}.zip" | grep 'nozzle-tester.app/Contents/MacOS/nozzle-tester'
          fi
          echo "package_root=${package_name}" >> "$GITHUB_OUTPUT"
          echo "package_name=${package_name}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_root }}
          path: ${{ steps.package.outputs.package_name }}
          if-no-files-found: error

      - name: Upload evidence fixture
        uses: actions/upload-artifact@v4
        with:
          name: evidence-nozzle-tester-self-test-${{ matrix.os }}
          path: build/nozzle-tester-self-test.json
          if-no-files-found: error


  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Move latest tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          pattern: nozzle-tester-*
          path: dist
          merge-multiple: true

      - name: Verify downloaded packages
        run: |
          short_sha="${GITHUB_SHA::7}"
          platforms=(macos-universal windows-x64 linux-x64)
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            prefix="nozzle-tester-latest-${short_sha}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            prefix="nozzle-tester-${GITHUB_REF_NAME}"
          else
            echo "unsupported release ref: ${GITHUB_REF}" >&2
            exit 1
          fi
          for platform in "${platforms[@]}"; do
            test -f "dist/${prefix}-${platform}.zip"
          done

      - name: Generate checksums and manifest
        env:
          APP_ID: nozzle-tester
          EXPECTED_PLATFORMS: "macos-universal windows-x64 linux-x64"
        run: |
          short_sha="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            prefix="nozzle-tester-latest-${short_sha}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            prefix="nozzle-tester-${GITHUB_REF_NAME}"
          else
            echo "unsupported release ref: ${GITHUB_REF}" >&2
            exit 1
          fi
          packages=(
            "dist/${prefix}-macos-universal.zip"
            "dist/${prefix}-windows-x64.zip"
            "dist/${prefix}-linux-x64.zip"
          )
          for package in "${packages[@]}"; do
            test -f "$package"
          done
          : > SHA256SUMS
          for package in "${packages[@]}"; do
            checksum=$(sha256sum "$package" | awk '{print $1}')
            printf '%s  %s\n' "$checksum" "$(basename "$package")" >> SHA256SUMS
          done
          python3 scripts/write-release-manifest.py --app-id "$APP_ID" --expected-platforms macos-universal windows-x64 linux-x64 --output manifest.json "${packages[@]}"
          cat SHA256SUMS
          cat manifest.json

      - name: Check versioned release asset does not exist
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="${GITHUB_REF_NAME}"
          mapfile -t package_paths < <(find dist -maxdepth 1 -name "nozzle-tester-${release_tag}-*.zip" -print | sort)
          packages=()
          for path in "${package_paths[@]}"; do
            packages+=("$(basename "$path")")
          done
          packages+=(SHA256SUMS manifest.json)
          if release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" --jq .id 2>/dev/null); then
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --jq '.[].name' > existing-assets.txt
            for asset in "${packages[@]}"; do
              if grep -Fx "$asset" existing-assets.txt; then
                echo "versioned release asset already exists: $asset" >&2
                exit 1
              fi
            done
          else
            echo "No existing release for $release_tag; create step will create it."
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            release_tag="latest"
            prefix="nozzle-tester-latest-${short_sha}"
            title="Latest development snapshot"
            notes="Mutable development snapshot from main. Commit: ${GITHUB_SHA}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_tag="${GITHUB_REF_NAME}"
            prefix="nozzle-tester-${GITHUB_REF_NAME}"
            title="$release_tag"
            notes="Release $release_tag"
          else
            echo "unsupported release ref: ${GITHUB_REF}" >&2
            exit 1
          fi
          assets=(
            "dist/${prefix}-macos-universal.zip"
            "dist/${prefix}-windows-x64.zip"
            "dist/${prefix}-linux-x64.zip"
            SHA256SUMS
            manifest.json
          )
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            if release_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" --jq .id 2>/dev/null); then
              gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --jq '.[].id' > release-asset-ids.txt
              while IFS= read -r asset_id; do
                if [ -n "$asset_id" ]; then
                  gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
                fi
              done < release-asset-ids.txt
              gh release edit "$release_tag" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "$title" \
                --notes "$notes" \
                --prerelease
              gh release upload "$release_tag" "${assets[@]}" --repo "${GITHUB_REPOSITORY}"
            else
              gh release create "$release_tag" "${assets[@]}" \
                --repo "${GITHUB_REPOSITORY}" \
                --verify-tag \
                --title "$title" \
                --notes "$notes" \
                --prerelease
            fi
          else
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" --jq .id >/dev/null 2>&1; then
              gh release upload "$release_tag" "${assets[@]}" --repo "${GITHUB_REPOSITORY}"
            else
              gh release create "$release_tag" "${assets[@]}" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "$title" \
                --notes "$notes"
            fi
          fi
          echo "Release URL and uploaded assets:"
          gh release view "$release_tag" --repo "${GITHUB_REPOSITORY}" --json url,assets --jq '.url, (.assets[].name)'
